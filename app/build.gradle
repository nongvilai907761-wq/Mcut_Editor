plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcut.editor'
    compileSdk 34

    defaultConfig {
        applicationId "com.mcut.editor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // กำหนดค่าความเข้ากันได้ของ Java ให้รองรับโค้ดใน MainActivity อย่างราบรื่น
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ไลบรารีพื้นฐานของ Android UI และ AppCompat
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ไลบรารีหลักสำหรับการจัดการไฟล์และ Activity Result
    implementation 'androidx.activity:activity-ktx:1.8.0'

    // --- ไลบรารีตัวประมวลผลวิดีโอและตัดต่อระดับโปร (เชื่อมต่อกับ MainActivity) ---
    implementation 'com.arthenica:ffmpeg-kit-full-gpl:6.0-2.lts'
}
